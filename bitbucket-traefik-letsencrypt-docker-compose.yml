# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:${TRAEFIK_IMAGE_VERSION:-3.7@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf}}
  postgres: &postgres-image ${BITBUCKET_POSTGRES_IMAGE_TAG:-postgres:${BITBUCKET_POSTGRES_IMAGE_VERSION:-17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675}}
  bitbucket: &bitbucket-image ${BITBUCKET_IMAGE_TAG:-atlassian/bitbucket:${BITBUCKET_IMAGE_VERSION:-10.4.2@sha256:2a02cc75c8523905b84905a5ef5d34eecd59c57738c4b0db0dadeb75b33f44d2}}

networks:
  bitbucket-network:
    external: true
  traefik-network:
    external: true

volumes:
  bitbucket-data:
  bitbucket-postgres:
  bitbucket-postgres-backup:
  bitbucket-data-backups:
  bitbucket-database-backups:
  traefik-certificates:

services:
  postgres:
    image: *postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    # Resource limits as .env-overridable defaults (e.g. BITBUCKET_POSTGRES_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${BITBUCKET_POSTGRES_MEMORY_LIMIT:-1g}
          cpus: "${BITBUCKET_POSTGRES_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${BITBUCKET_POSTGRES_MEMORY_RESERVATION:-128m}
          cpus: "${BITBUCKET_POSTGRES_CPU_RESERVATION:-0.25}"
    volumes:
      - bitbucket-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${BITBUCKET_DB_NAME:-bitbucketdb}
      POSTGRES_USER: ${BITBUCKET_DB_USER:-bitbucketdbuser}
      POSTGRES_PASSWORD: ${BITBUCKET_DB_PASSWORD:?set in .env - see .env.example for generation command}
    networks:
      - bitbucket-network
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "${BITBUCKET_DB_NAME:-bitbucketdb}", "-U", "${BITBUCKET_DB_USER:-bitbucketdbuser}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  bitbucket:
    image: *bitbucket-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. BITBUCKET_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${BITBUCKET_MEMORY_LIMIT:-2g}
          cpus: "${BITBUCKET_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${BITBUCKET_MEMORY_RESERVATION:-256m}
          cpus: "${BITBUCKET_CPU_RESERVATION:-0.5}"
    volumes:
      - bitbucket-data:${DATA_PATH:-/var/atlassian/application-data/bitbucket}
    environment:
      JVM_MINIMUM_MEMORY: ${BITBUCKET_JVM_MINIMUM_MEMORY:-1G}
      JVM_MAXIMUM_MEMORY: ${BITBUCKET_JVM_MAXIMUM_MEMORY:-4G}
      SERVER_PROXY_NAME: ${BITBUCKET_HOSTNAME:?set in .env - see .env.example}
      SERVER_SECURE: 'true'
      SERVER_SCHEME: https
      SERVER_PROXY_PORT: 443
      SETUP_DISPLAYNAME: Bitbucket
      SETUP_BASEURL: ${BITBUCKET_URL:?set in .env - see .env.example}
      JDBC_DRIVER: org.postgresql.Driver
      JDBC_USER: ${BITBUCKET_DB_USER:-bitbucketdbuser}
      JDBC_PASSWORD: ${BITBUCKET_DB_PASSWORD}
      JDBC_URL: jdbc:postgresql://postgres:5432/${BITBUCKET_DB_NAME:-bitbucketdb}
    networks:
      - bitbucket-network
      - traefik-network
    healthcheck:
      # Port check only, no HTTP client: with SERVER_SECURE/SERVER_SCHEME
      # set for the reverse proxy, Bitbucket answers plain-HTTP requests
      # with a redirect to the public hostname, which is not resolvable
      # from inside the container — an HTTP healthcheck that follows it
      # fails forever, and Traefik removes permanently unhealthy
      # containers from load balancing.
      test: ["CMD-SHELL", "timeout 10 bash -c ':> /dev/tcp/127.0.0.1/7990' || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 3
      start_period: 120s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.bitbucket.rule=Host(`${BITBUCKET_HOSTNAME}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.bitbucket.service=bitbucket"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.bitbucket.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.bitbucket.loadbalancer.server.port=7990"
      # Enable TLS on this router
      - "traefik.http.routers.bitbucket.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.bitbucket.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.bitbucket.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.bitbucket.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Define TCP router rules for Bitbucket to match all incoming requests (HostSNI)
      - "traefik.tcp.routers.bitbucket-ssh.rule=HostSNI(`*`)"
      # Assign the Bitbucket SS router to a named Traefik service
      - "traefik.tcp.routers.bitbucket-ssh.service=bitbucket-ssh"
      # Use the 'Bitbucket' (custom) entry point
      - "traefik.tcp.routers.bitbucket-ssh.entrypoints=ssh"
      # Define the internal container port for routing to the Bitbucket service
      - "traefik.tcp.services.bitbucket-ssh.loadbalancer.server.port=7999"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Resource limits as .env-overridable defaults (e.g. TRAEFIK_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Define the SSH entry point on port 7999
      - "--entryPoints.ssh.address=:7999"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
      - "7999:7999"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: *postgres-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. BITBUCKET_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${BITBUCKET_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${BITBUCKET_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${BITBUCKET_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${BITBUCKET_BACKUPS_CPU_RESERVATION:-0.1}"
    command: >-
      bash -c 'set -o pipefail;
      sleep "$$BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$POSTGRES_BACKUPS_PATH/$$POSTGRES_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        if pg_dump -h postgres -p 5432 -d $$BITBUCKET_DB_NAME -U $$BITBUCKET_DB_USER | gzip > "$$DB_FILE"; then
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        DATA_FILE="$$DATA_BACKUPS_PATH/$$DATA_BACKUP_NAME-$$STAMP.tar.gz";
        echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE";
        # GNU tar exits 1 when a live application changed a file mid-read;
        # the archive is complete - only exit 2 is a real failure. No GNU-only
        # flags: alpine images ship BusyBox tar.
        tar -zcpf "$$DATA_FILE" $$DATA_PATH; RC=$$?;
        if [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; then
          echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)$$([ "$$RC" -eq 1 ] && echo " - some files changed while being read")";
        else
          echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2;
          mv "$$DATA_FILE" "$$DATA_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${POSTGRES_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$POSTGRES_BACKUPS_PATH" -type f -name "$$POSTGRES_BACKUP_NAME-*" -mtime "+$$POSTGRES_BACKUP_PRUNE_DAYS" -delete;
        fi;
        if [ "$${DATA_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$DATA_BACKUPS_PATH" -type f -name "$$DATA_BACKUP_NAME-*" -mtime "+$$DATA_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$BACKUP_INTERVAL";
      done'
    volumes:
      - bitbucket-postgres-backup:/var/lib/postgresql/data
      - bitbucket-data:${DATA_PATH:-/var/atlassian/application-data/bitbucket}
      - bitbucket-data-backups:${DATA_BACKUPS_PATH:-/srv/bitbucket-application-data/backups}
      - bitbucket-database-backups:${POSTGRES_BACKUPS_PATH:-/srv/bitbucket-postgres/backups}
    environment:
      BITBUCKET_DB_NAME: ${BITBUCKET_DB_NAME:-bitbucketdb}
      BITBUCKET_DB_USER: ${BITBUCKET_DB_USER:-bitbucketdbuser}
      PGPASSWORD: ${BITBUCKET_DB_PASSWORD}
      BACKUP_INIT_SLEEP: ${BACKUP_INIT_SLEEP:-30m}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      POSTGRES_BACKUP_PRUNE_DAYS: ${POSTGRES_BACKUP_PRUNE_DAYS:-7}
      DATA_BACKUP_PRUNE_DAYS: ${DATA_BACKUP_PRUNE_DAYS:-7}
      POSTGRES_BACKUPS_PATH: ${POSTGRES_BACKUPS_PATH:-/srv/bitbucket-postgres/backups}
      DATA_BACKUPS_PATH: ${DATA_BACKUPS_PATH:-/srv/bitbucket-application-data/backups}
      DATA_PATH: ${DATA_PATH:-/var/atlassian/application-data/bitbucket}
      POSTGRES_BACKUP_NAME: ${POSTGRES_BACKUP_NAME:-bitbucket-postgres-backup}
      DATA_BACKUP_NAME: ${DATA_BACKUP_NAME:-bitbucket-application-data-backup}
    networks:
      - bitbucket-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
